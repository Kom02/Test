<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="css/global2.css">
  <link rel="stylesheet" href="css/kefir.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Dignity Kefir, inicio">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>Dignity Kefir</span>
      </a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="nosotros.html" aria-current="page">Nosotros</a>
        <a href="menu.html">Producto</a>
        <a class="button button-small" data-site-email href="#contacto">Pide aquí <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero" aria-labelledby="about-title">
      <div class="container page-hero-grid">
        <div>
          <p class="eyebrow" data-site="about.hero.eyebrow"></p>
          <h1 id="about-title"><span data-site="about.hero.title"></span> <em data-site="about.hero.highlight"></em></h1>
          <p class="hero-text" data-site="about.hero.text"></p>
        </div>
        <div class="about-art" aria-hidden="true">
          <span class="about-art-circle"></span>
          <span class="about-art-label" data-site="about.hero.artLabel"></span>
        </div>
      </div>
    </section>

    <section class="intro-band" aria-labelledby="story-title">
      <div class="container intro-grid">
        <p class="section-number">01 <span>/</span> <span data-site="about.story.eyebrow"></span></p>
        <div>
          <h2 id="story-title" data-site="about.story.title"></h2>
          <p class="large-copy" data-site="about.story.text"></p>
        </div>
      </div>
    </section>

    <section class="principles" aria-labelledby="values-title">
      <div class="container">
        <div class="section-heading">
          <p class="section-number">02 <span>/</span> <span data-site="about.values.eyebrow"></span></p>
          <h2 id="values-title"><span data-site="about.values.title"></span><br><em data-site="about.values.highlight"></em></h2>
        </div>
        <div class="principles-list" data-site-list="about.values.items"></div>
      </div>
    </section>

    <section class="contact-band" id="contacto" aria-labelledby="contact-title">
      <div class="container contact-inner">
        <p class="eyebrow" data-site="contact.eyebrow"></p>
        <h2 id="contact-title"><span data-site="contact.title"></span><br><em data-site="contact.highlight"></em></h2>
        <a class="button button-light" data-site-email href="#contacto"><span data-site="contact.email"></span> <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="index.html" aria-label="Dignity Kefir, inicio"><span class="brand-mark" aria-hidden="true">D</span><span>Dignity Kefir</span></a>
      <p data-site="footer.description"></p>
      <p>© <span data-site="footer.year"></span> Dignity Kefir</p>
    </div>
  </footer>
  <script src="js/site.js" defer></script>
</body>
</html>
