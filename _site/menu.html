<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="css/global2.css">
  <link rel="stylesheet" href="css/kefir.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Dignity Kefir, inicio">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>Dignity Kefir</span>
      </a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="menu.html" aria-current="page">Producto</a>
        <a class="button button-small" data-site-email href="#contacto">Pide aquí <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero menu-hero" aria-labelledby="menu-title">
      <div class="container">
        <p class="eyebrow" data-site="menu.hero.eyebrow"></p>
        <h1 id="menu-title"><span data-site="menu.hero.title"></span> <em data-site="menu.hero.highlight"></em></h1>
        <p class="hero-text" data-site="menu.hero.text"></p>
      </div>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="container">
        <div class="section-heading">
          <p class="section-number">01 <span>/</span> <span data-site="menu.catalog.eyebrow"></span></p>
          <div>
            <h2 id="catalog-title"><span data-site="menu.catalog.title"></span><br><em data-site="menu.catalog.highlight"></em></h2>
            <p class="large-copy" data-site="menu.catalog.text"></p>
          </div>
        </div>
        <div class="product-grid" data-site-list="menu.products"></div>
      </div>
    </section>

    <section class="contact-band" id="contacto" aria-labelledby="contact-title">
      <div class="container contact-inner">
        <p class="eyebrow" data-site="contact.eyebrow"></p>
        <h2 id="contact-title"><span data-site="contact.title"></span><br><em data-site="contact.highlight"></em></h2>
        <a class="button button-light" data-site-email href="#contacto"><span data-site="contact.email"></span> <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="index.html" aria-label="Dignity Kefir, inicio"><span class="brand-mark" aria-hidden="true">D</span><span>Dignity Kefir</span></a>
      <p data-site="footer.description"></p>
      <p>© <span data-site="footer.year"></span> Dignity Kefir</p>
    </div>
  </footer>
  <script src="js/site.js" defer></script>
</body>
</html>
