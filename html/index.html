<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="css/global2.css">
  <link rel="stylesheet" href="css/kefir.css">
  <link rel="stylesheet" href="css/product-photo.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Dignity Kefir, inicio">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>Dignity Kefir</span>
      </a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="index.html" aria-current="page">Inicio</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="menu.html">Producto</a>
        <a class="button button-small" data-site-email href="#contacto">Pide aquí <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow" data-site="home.hero.eyebrow"></p>
          <h1 id="hero-title"><span data-site="home.hero.title"></span> <em data-site="home.hero.highlight"></em></h1>
          <p class="hero-text" data-site="home.hero.text"></p>
          <div class="hero-actions">
            <a class="button" href="menu.html">Conoce el kéfir <span aria-hidden="true">↗</span></a>
            <a class="text-link" href="#favoritos">Nuestro producto <span aria-hidden="true">↓</span></a>
          </div>
        </div>
        <div class="hero-art drink-hero-art" aria-label="Ilustración abstracta de una botella de kéfir" role="img">
          <div class="art-sun"></div>
          <div class="art-arch"></div>
          <div class="art-card art-card-back"></div>
          <div class="art-card art-card-front">
            <span class="art-label" data-site="home.hero.artLabel"></span>
            <strong>01</strong>
          </div>
          <span class="art-caption" data-site="home.hero.artCaption"></span>
        </div>
      </div>
    </section>

    <section class="featured-product" id="favoritos" aria-labelledby="featured-title">
      <div class="container featured-product-grid">
        <div class="featured-product-art">
          <span class="featured-product-stamp" data-site="home.featured.artLabel"></span>
          <img class="featured-product-photo" src="/resources/kefir.png" alt="Kéfir de leche y sus gránulos en un recipiente de vidrio">
          <span class="featured-art-caption" data-site="home.featured.artCaption"></span>
        </div>
        <div class="featured-product-copy">
          <p class="section-number">01 <span>/</span> <span data-site="home.featured.eyebrow"></span></p>
          <h2 id="featured-title"><span data-site="home.featured.title"></span><br><em data-site="home.featured.highlight"></em></h2>
          <p class="large-copy featured-product-intro" data-site="home.featured.text"></p>
          <div class="featured-details">
            <div>
              <h3 data-site="home.featured.benefitsTitle"></h3>
              <div class="featured-benefits" data-site-list="home.featured.benefits"></div>
            </div>
            <div class="preparation-note">
              <h3 data-site="home.featured.preparationTitle"></h3>
              <p data-site="home.featured.preparation"></p>
            </div>
          </div>
          <p class="product-note" data-site="home.featured.disclaimer"></p>
          <a class="button" data-site-email href="#contacto"><span data-site="home.featured.orderText"></span> <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>

    <section class="home-note" aria-labelledby="home-note-title">
      <div class="container home-note-inner">
        <p class="eyebrow" data-site="home.note.eyebrow"></p>
        <h2 id="home-note-title"><span data-site="home.note.title"></span> <em data-site="home.note.highlight"></em></h2>
        <a class="text-link" href="nosotros.html">Conoce nuestra historia <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="contact-band" id="contacto" aria-labelledby="contact-title">
      <div class="container contact-inner">
        <p class="eyebrow" data-site="contact.eyebrow"></p>
        <h2 id="contact-title"><span data-site="contact.title"></span><br><em data-site="contact.highlight"></em></h2>
        <a class="button button-light" data-site-email href="#contacto"><span data-site="contact.email"></span> <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="index.html" aria-label="Dignity Kefir, inicio"><span class="brand-mark" aria-hidden="true">D</span><span>Dignity Kefir</span></a>
      <p data-site="footer.description"></p>
      <p>© <span data-site="footer.year"></span> Dignity Kefir</p>
    </div>
  </footer>
  <script src="js/site.js" defer></script>
</body>
</html>
