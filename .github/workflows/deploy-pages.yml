name: Build and deploy Dignity Kefir

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const requiredFiles = [
            'index.html',
            'menu.html',
            'nosotros.html',
            'data/siteData.home.json',
            'data/siteData.about.json',
            'data/siteData.menu.json',
            'designs/global.css',
            'designs/global2.css',
            'designs/kefir.css',
            'sites/site.js',
            'resources/kefir.png',
          ];

          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) {
              throw new Error(`Falta el archivo requerido en el repositorio: ${file}`);
            }
          }

          const pages = ['home', 'about', 'menu'];
          const sites = Object.fromEntries(pages.map((page) => [
            page,
            JSON.parse(fs.readFileSync(`data/siteData.${page}.json`, 'utf8')),
          ]));
          if (
            !sites.home.meta?.title
            || !sites.home.home?.featured
            || !Array.isArray(sites.home.menu?.products)
            || !sites.about.about?.hero
            || !Array.isArray(sites.about.about?.values?.items)
            || !Array.isArray(sites.menu.menu?.products)
          ) {
            throw new Error('Los archivos de datos por página no tienen el esquema esperado de Dignity Kefir.');
          }

          const output = '_site';
          fs.rmSync(output, { recursive: true, force: true });
          fs.mkdirSync(path.join(output, 'css'), { recursive: true });
          fs.mkdirSync(path.join(output, 'js'), { recursive: true });
          fs.mkdirSync(path.join(output, 'api'), { recursive: true });
          fs.mkdirSync(path.join(output, 'resources'), { recursive: true });

          for (const file of ['index.html', 'menu.html', 'nosotros.html']) {
            fs.copyFileSync(file, path.join(output, file));
          }

          for (const file of ['global.css', 'global2.css', 'kefir.css']) {
            fs.copyFileSync(path.join('designs', file), path.join(output, 'css', file));
          }

          fs.writeFileSync(path.join(output, 'css', 'product-photo.css'), `
          .featured-product-photo {
            position: relative;
            z-index: 1;
            display: block;
            width: auto;
            max-width: 100%;
            height: min(62vh, 590px);
            object-fit: contain;
            filter: drop-shadow(12px 18px 15px rgba(41, 53, 43, 0.18));
          }
          @media (max-width: 760px) {
            .featured-product-photo { height: 300px; }
          }
          `);

          fs.copyFileSync('sites/site.js', path.join(output, 'js', 'site.js'));

          for (const page of pages) {
            fs.copyFileSync(`data/siteData.${page}.json`, path.join(output, 'api', `${page}.json`));
          }
          fs.copyFileSync('resources/kefir.png', path.join(output, 'resources', 'kefir.png'));
          fs.writeFileSync(path.join(output, '.nojekyll'), '');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
